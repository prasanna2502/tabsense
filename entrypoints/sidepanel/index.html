<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Title is set from the branding module in main.ts (single source). -->
    <title>Tabs</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1 id="product-name"></h1>
      <p id="tagline"></p>
    </header>

    <section id="summary" aria-live="polite">
      <div class="stat">
        <span class="stat-value" id="stat-total">–</span>
        <span class="stat-label">open tabs</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-duplicates">–</span>
        <span class="stat-label">exact duplicates</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-engine">–</span>
        <span class="stat-label">normalize engine</span>
      </div>
    </section>

    <section id="settings">
      <label>
        <input type="checkbox" id="opt-autoclose" />
        Automatically close exact duplicates (focus the open copy instead)
      </label>
      <p id="autoclose-note" class="note" hidden></p>
    </section>

    <section id="dup-sets" hidden>
      <h2>Duplicate documents</h2>
      <ul id="set-list"></ul>
    </section>

    <section id="fuzzy-sets" hidden>
      <h2>Same document, different view</h2>
      <p class="note">
        Same document open in different views or states. These are
        never auto-closed.
      </p>
      <ul id="fuzzy-list"></ul>
    </section>

    <section id="activity-section" hidden>
      <h2>Recently closed duplicates</h2>
      <ul id="activity-list"></ul>
    </section>

    <section>
      <h2>Open tabs</h2>
      <ul id="tab-list"></ul>
    </section>

    <footer>
      <p id="swap-stats"></p>
      <p id="status"></p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
