[package]
name = "tabsense-core"
version = "0.0.1"
edition = "2021"
description = "Rust core for the extension, compiled to WebAssembly (URL normalization today; canonicalizer/index/scoring as the project grows). Product name intentionally absent — it lives only in src/config/branding.ts."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
url = "2"
wasm-bindgen = "0.2"
# For the M2 scorer's JSON boundary (serde_json::Value only — no
# derive), parsing tab/group payloads and emitting candidates.
serde_json = "1"

# The golden-corpus integration test (core/tests/corpus.rs) also
# parses the shared corpus JSON via the serde_json dependency above.
[profile.release]
# Keep the module tiny: it is instantiated on service-worker warm-up.
opt-level = "s"
lto = true

# wasm-pack's built-in wasm-opt step downloads binaryen itself, which is
# unreliable in some environments; scripts/build-wasm.mjs runs a locally
# installed wasm-opt instead (when present).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
